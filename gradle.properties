# -Dfile.encoding=COMPAT（JDK 18+ 恢复旧默认编码）：本机原生码页是 GBK，
# 而 worker JVM 读 @argfile 时用的是原生编码。守护进程若按 UTF-8 写 argfile，
# D:\课程表\app\build\... 这几条类路径会变乱码，测试报 initializationError。
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=COMPAT
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# 项目路径含中文（D:\课程表），关闭 AGP 的 ASCII 路径检查（本项目不使用 NDK）
android.overridePathCheck=true

kotlin.code.style=official
